name: appsec-compose scan

# Tests the collector, smoke-tests the pipeline, then scans this repository with
# the reusable action in ./action.yml — exactly what `uses:
# denimoll/appsec-compose@v.X.Y.Z` runs in another repo: per-tool SARIF upload to
# code scanning, a reports artifact, cached vuln DBs and the policy verdict in
# the job summary.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Collector unit tests — the scan is only as trustworthy as the code that
  # normalizes, de-duplicates and gates the findings.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # no token left in .git for later steps
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with: { python-version: "3.14" }
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests/ -q

  # End-to-end: the unit tests cannot see the compose wiring, and an engine
  # whose command line breaks upstream can still exit 0 with an empty report.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # no token left in .git for later steps
      - name: Cache scanner DBs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: cache
          key: appsec-smoke-${{ runner.os }}-${{ hashFiles('scan-config.yml') }}
          restore-keys: appsec-smoke-${{ runner.os }}-
      - run: ./scripts/smoke-test.sh

  # Dogfoods the action on this repository, gate included: a finding at or
  # above `high` fails the build. .github/appsec-compose.yml keeps the
  # deliberately vulnerable fixture (tests/fixtures/vulnerable-repo) out of the
  # scan and out of code scanning.
  scan:
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # only this job uploads SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }   # no token left in .git for later steps

      - name: Run appsec-compose
        id: appsec
        uses: ./  # zizmor: ignore[self-repository] -- dogfoods this checkout
        with:
          config: .github/appsec-compose.yml
